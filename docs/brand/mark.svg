<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- FinSwipe mark, refined. Arrow up, F/I/N stacked down the shaft like ledger rows.
       Head: tip 50,4 shoulders y=44 (45°), fat round-joined stroke softens the apex.
       Shaft floats 3 units below the head (30..70, y 47..97), feet radius 6.
       Hairline rules between letter rows = the ledger. Colours are theme.dart:
       green #3ECF8E, inkDim #9BA09C shaft, border-grey rules, ink #E8E6E3 letters. -->
  <path d="M10 44 L50 4 L90 44 Z" fill="#3ECF8E" stroke="#3ECF8E" stroke-width="5" stroke-linejoin="round"/>
  <path d="M70 47 L70 91 Q70 97 64 97 L36 97 Q30 97 30 91 L30 47" fill="none" stroke="#9BA09C" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <line x1="36" y1="64" x2="64" y2="64" stroke="#9BA09C" stroke-width="1" opacity="0.28"/>
  <line x1="36" y1="80.5" x2="64" y2="80.5" stroke="#9BA09C" stroke-width="1" opacity="0.28"/>
  <text x="50" y="60.5" text-anchor="middle" font-family="Georgia,'Noto Serif',serif" font-size="15" fill="#E8E6E3">F</text>
  <text x="50" y="77" text-anchor="middle" font-family="Georgia,'Noto Serif',serif" font-size="15" fill="#E8E6E3">I</text>
  <text x="50" y="93.5" text-anchor="middle" font-family="Georgia,'Noto Serif',serif" font-size="15" fill="#E8E6E3">N</text>
</svg>
