<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- FinSwipe mark. No solid head any more: three green chevrons rise off the shaft,
       fading upward — a motion trail, the swipe itself. Shaft keeps the ledger rows
       with F/I/N. Static file; mark-animated.svg is the moving version.
       Colours are theme.dart: green #3ECF8E, inkDim #9BA09C, ink #E8E6E3. -->
  <g stroke="#3ECF8E" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M16 45 L50 30 L84 45" opacity="1"/>
    <path d="M16 32 L50 17 L84 32" opacity="0.55"/>
    <path d="M16 19 L50 4 L84 19" opacity="0.28"/>
  </g>
  <path d="M70 49 L70 91 Q70 97 64 97 L36 97 Q30 97 30 91 L30 49" fill="none" stroke="#9BA09C" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <line x1="36" y1="65" x2="64" y2="65" stroke="#9BA09C" stroke-width="1" opacity="0.28"/>
  <line x1="36" y1="81" x2="64" y2="81" stroke="#9BA09C" stroke-width="1" opacity="0.28"/>
  <text x="50" y="61.5" text-anchor="middle" font-family="Georgia,'Noto Serif',serif" font-size="15" fill="#E8E6E3">F</text>
  <text x="50" y="77.5" text-anchor="middle" font-family="Georgia,'Noto Serif',serif" font-size="15" fill="#E8E6E3">I</text>
  <text x="50" y="93.5" text-anchor="middle" font-family="Georgia,'Noto Serif',serif" font-size="15" fill="#E8E6E3">N</text>
</svg>
