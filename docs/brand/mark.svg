<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- FinSwipe mark (final, 13 Sep 2026). One capsule: the grey ledger shaft's sides run up
       and meet the lowest of four green chevrons, which rise and fade upward - the swipe
       itself, drawn as a motion trail. Shaft keeps the ledger rows with F/I/N.
       Colours are theme.dart: green #3ECF8E, inkDim #9BA09C, ink #E8E6E3. -->
  <path d="M74 44 L74 73 A24 24 0 0 1 26 73 L26 44" fill="none" stroke="#9BA09C" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <g stroke="#3ECF8E" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M26 44 L50 32 L74 44" opacity="1"/>
    <path d="M26 35 L50 23 L74 35" opacity="0.72"/>
    <path d="M26 26 L50 14 L74 26" opacity="0.46"/>
    <path d="M26 17 L50 5 L74 17" opacity="0.26"/>
  </g>
  <line x1="33" y1="65.5" x2="67" y2="65.5" stroke="#9BA09C" stroke-width="1" opacity="0.28"/>
  <line x1="33" y1="81.5" x2="67" y2="81.5" stroke="#9BA09C" stroke-width="1" opacity="0.28"/>
  <text x="50" y="60.5" text-anchor="middle" font-family="Georgia,'Noto Serif',serif" font-size="16" fill="#E8E6E3">F</text>
  <text x="50" y="76.5" text-anchor="middle" font-family="Georgia,'Noto Serif',serif" font-size="16" fill="#E8E6E3">I</text>
  <text x="50" y="92.5" text-anchor="middle" font-family="Georgia,'Noto Serif',serif" font-size="16" fill="#E8E6E3">N</text>
</svg>
