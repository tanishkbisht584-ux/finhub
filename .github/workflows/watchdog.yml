name: watchdog
# End-to-end health monitor for the whole failure map:
#   repo gone private (free minutes would die)     -> alert
#   pipeline crash-looping (bad secret/dep/commit) -> alert (restart is useless)
#   pipeline dead / cron-lagged                    -> self-heal: dispatch a run
#   ingesting but nothing approved (gate stalled)  -> alert
#   feed ranking frozen (app's own query checked)  -> alert
#   Supabase unreachable                           -> alert (nothing can heal it)
# Alerts = one open `watchdog` issue at a time; GitHub emails the owner.
# App-side failures (stale APK, expired session) are invisible from here.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write   # restart the pipeline
  issues: write    # raise the alarm

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Health check
        shell: python
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          import json, os, sys, urllib.parse, urllib.request
          from datetime import datetime, timedelta, timezone

          INGEST_MAX_H = 3     # no new approved story for this long => frozen
          FEED_TOP_MAX_H = 12  # nothing fresh in the feed's visible top => frozen

          def call(url, hdrs, data=None, method=None):
              req = urllib.request.Request(url, data=data, method=method, headers=hdrs)
              with urllib.request.urlopen(req) as r:
                  body = r.read()
                  return json.loads(body) if body else None

          gh = "https://api.github.com/repos/" + os.environ["REPO"]
          gh_hdrs = {"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                     "Accept": "application/vnd.github+json"}

          needs_you, healed = [], []

          # repo must stay public: private caps Actions at 2k min/month and the
          # resident poller (~340 min/run) exhausts that in about 6 runs
          if call(gh, gh_hdrs)["private"]:
              needs_you.append("Repo is PRIVATE — Actions free minutes will run out "
                               "within a day; make it public or the pipeline stops.")

          # crash loop is invisible from outside: cron keeps 'restarting' a run
          # that dies in seconds, so the schedule looks alive while nothing works
          runs = call(gh + "/actions/workflows/pipeline.yml/runs?per_page=10",
                      gh_hdrs)["workflow_runs"]
          active = any(r["status"] in ("queued", "in_progress") for r in runs)
          done = [r for r in runs
                  if r["status"] == "completed" and r["conclusion"] != "cancelled"]
          crash_loop = len(done) >= 3 and all(
              r["conclusion"] == "failure" for r in done[:3])
          if crash_loop:
              needs_you.append("Pipeline is CRASH-LOOPING (3 straight failed runs) — "
                               "restarting won't help. Likely a broken secret, "
                               f"dependency, or commit. Logs: {done[0]['html_url']}")

          now = datetime.now(timezone.utc)
          def age_h(iso):
              dt = datetime.fromisoformat(iso.replace("Z", "+00:00"))
              return (now - dt).total_seconds() / 3600

          starved = False
          try:
              sb_url = os.environ["SUPABASE_URL"] + "/rest/v1/"
              key = os.environ["SUPABASE_SERVICE_KEY"]
              sb = {"apikey": key, "Authorization": "Bearer " + key}

              def newest_age(filt):
                  rows = call(sb_url + "stories?select=created_at&" + filt
                              + "order=created_at.desc&limit=1", sb)
                  return age_h(rows[0]["created_at"]) if rows else 999

              approved_age = newest_age("status=eq.approved&")
              ingested_age = newest_age("")  # any status: is anything arriving?

              # the exact query the app runs, so ranking bugs are caught too
              since = urllib.parse.quote((now - timedelta(hours=48)).isoformat())
              top = call(sb_url + "stories?select=published_at&status=eq.approved"
                         f"&published_at=gte.{since}"
                         "&order=is_featured.desc,published_at.desc&limit=10", sb)
              top_age = min((age_h(r["published_at"]) for r in top), default=999)

              if approved_age > INGEST_MAX_H:
                  if ingested_age <= INGEST_MAX_H:
                      needs_you.append(
                          f"Stories are ingesting (newest {ingested_age:.1f}h old) but "
                          f"NONE approved in {approved_age:.1f}h — the approval gate "
                          "or AI scoring is stalled, not the sources.")
                  else:
                      starved = True  # nothing arriving at all => restartable
              if top_age > FEED_TOP_MAX_H:
                  needs_you.append(
                      "Feed ranking frozen: freshest story in the visible top 10 is "
                      f"{top_age:.1f}h old while ingestion is fine.")
          except Exception as e:
              needs_you.append(
                  f"Supabase unreachable from the watchdog: {e}. If Supabase itself "
                  "is down, wait it out — the app serves its offline cache; if the "
                  "project was paused or the key rotated, fix that.")

          # self-heal: restart the pipeline only when that can actually help
          if starved:
              msg = f"nothing ingested in {ingested_age:.1f}h"
              if crash_loop:
                  pass  # already flagged; another dispatch would just crash again
              elif active:
                  needs_you.append(f"{msg} although a pipeline run is active — the "
                                   "freeze is inside the run; check its logs.")
              else:
                  call(gh + "/actions/workflows/pipeline.yml/dispatches", gh_hdrs,
                       data=json.dumps({"ref": "main"}).encode(), method="POST")
                  healed.append(f"{msg} and no run was active — dispatched a fresh "
                                "pipeline run.")

          if not needs_you:
              state = healed[0] if healed else (
                  f"healthy: approved {approved_age:.1f}h ago, "
                  f"feed top {top_age:.1f}h old")
              print("self-healed: " + state if healed else state)
              sys.exit(0)

          # alert: at most one open watchdog issue; GitHub emails the owner
          if not call(gh + "/issues?labels=watchdog&state=open", gh_hdrs):
              body = "\n".join(
                  ["## Needs you", ""]
                  + [f"- {p}" for p in needs_you]
                  + (["", "## Auto-healed", ""] + [f"- {h}" for h in healed]
                     if healed else [])
                  + ["", "_Raised automatically by watchdog.yml (hourly)._"])
              # assign the owner: GitHub always emails an assignee, whereas issues
              # in an unwatched repo notify nobody
              call(gh + "/issues", gh_hdrs,
                   data=json.dumps({"title": "Watchdog: pipeline needs attention",
                                    "body": body,
                                    "labels": ["watchdog"],
                                    "assignees": [os.environ["REPO"].split("/")[0]]}
                                   ).encode(),
                   method="POST")

          print("NEEDS ATTENTION:", " | ".join(needs_you))
          sys.exit(1)
