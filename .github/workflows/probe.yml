name: probe
# Temporary: does a GitHub runner (Azure IP) get past Yahoo spark and NSE's
# Akamai layer? Decides whether market.py can run from Actions. Delete after.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests==2.33.0
      - shell: python
        run: |
          import requests, time
          UA = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36",
                "Accept": "*/*", "Accept-Language": "en-US,en;q=0.9"}
          syms = ["TCS.NS","INFY.NS","RELIANCE.NS","HDFCBANK.NS","M&M.NS","^NSEI","^BSESN","GC=F","USDINR=X","BTC-USD"]
          for i in range(3):
              r = requests.get("https://query1.finance.yahoo.com/v8/finance/spark",
                               params={"symbols": ",".join(syms), "range": "5d", "interval": "1d"},
                               headers=UA, timeout=20)
              keys = list(r.json().keys())[:4] if r.ok else r.text[:120]
              print(f"YAHOO spark #{i+1}: {r.status_code} {keys}")
              time.sleep(1)
          r = requests.get("https://api.coingecko.com/api/v3/simple/price",
                           params={"ids": "bitcoin", "vs_currencies": "inr"}, headers=UA, timeout=20)
          print("COINGECKO:", r.status_code, r.text[:80])
          r = requests.get("https://api.mfapi.in/mf/120503/latest", headers=UA, timeout=20)
          print("MFAPI:", r.status_code, r.text[:80])
          s = requests.Session(); s.headers.update({**UA, "Referer": "https://www.nseindia.com/"})
          for warm in ("https://www.nseindia.com/", "https://www.nseindia.com/market-data/live-equity-market"):
              try:
                  w = s.get(warm, timeout=20); print("NSE warm", warm, w.status_code, len(s.cookies))
              except Exception as e:
                  print("NSE warm err", warm, e)
          for path in ("allIndices", "event-calendar?index=equities",
                       "snapshot-capital-market-largedeal", "corporate-board-meetings?index=equities"):
              try:
                  r = s.get(f"https://www.nseindia.com/api/{path}", timeout=25)
                  ct = r.headers.get("content-type", "")
                  print(f"NSE {path}: {r.status_code} {ct[:30]} {len(r.content)}")
              except Exception as e:
                  print(f"NSE {path}: err {e}")
