name: probe
# Temporary: can a GitHub runner do Yahoo's cookie+crumb dance (quoteSummary)
# and reach NSE's FII/DII + option-chain endpoints? Decides v0.20.0's
# fundamentals source. Delete after.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests==2.33.0
      - shell: python
        run: |
          import requests, time
          UA = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36",
                "Accept": "*/*", "Accept-Language": "en-US,en;q=0.9"}
          s = requests.Session(); s.headers.update(UA)
          try:
              r = s.get("https://fc.yahoo.com/", timeout=20); print("fc.yahoo", r.status_code, len(s.cookies))
          except Exception as e:
              print("fc.yahoo err", e)
          r = s.get("https://query1.finance.yahoo.com/v1/test/getcrumb", timeout=20)
          crumb = r.text.strip(); print("getcrumb", r.status_code, repr(crumb[:12]))
          for sym in ("TCS.NS", "RELIANCE.NS", "M&M.NS"):
              r = s.get(f"https://query1.finance.yahoo.com/v10/finance/quoteSummary/{sym}",
                        params={"modules": "summaryDetail,defaultKeyStatistics,financialData,incomeStatementHistoryQuarterly,majorHoldersBreakdown,assetProfile", "crumb": crumb}, timeout=25)
              ok = r.ok and "quoteSummary" in r.text
              pe = None
              if ok:
                  try: pe = r.json()["quoteSummary"]["result"][0]["summaryDetail"]["trailingPE"]["raw"]
                  except Exception as e: pe = f"parse {e}"
              print(f"quoteSummary {sym}: {r.status_code} pe={pe}")
              time.sleep(0.5)
          r = s.get("https://query1.finance.yahoo.com/v8/finance/chart/TCS.NS", params={"range": "1y", "interval": "1d"}, timeout=25)
          print("chart 1y:", r.status_code, len(r.json()["chart"]["result"][0]["timestamp"]) if r.ok else r.text[:80])
          n = requests.Session(); n.headers.update({**UA, "Referer": "https://www.nseindia.com/"})
          try: n.get("https://www.nseindia.com/", timeout=8)
          except Exception: pass
          for path, params in (("fiidiiTradeReact", {}), ("option-chain-contract-info", {"symbol": "NIFTY"}), ("allIndices", {})):
              r = n.get(f"https://www.nseindia.com/api/{path}", params=params, timeout=25)
              print(f"NSE {path}: {r.status_code} {r.headers.get('content-type','')[:20]} {len(r.content)}")
              if path == "option-chain-contract-info" and r.ok:
                  exp = r.json()["expiryDates"][0]
                  r2 = n.get("https://www.nseindia.com/api/option-chain-v3", params={"type": "Indices", "symbol": "NIFTY", "expiry": exp}, timeout=30)
                  f = r2.json().get("filtered", {}) if r2.ok else {}
                  print(f"NSE option-chain-v3 {exp}: {r2.status_code} CE={f.get('CE',{}).get('totOI')} PE={f.get('PE',{}).get('totOI')}")
