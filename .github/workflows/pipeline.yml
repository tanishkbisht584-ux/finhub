name: pipeline
on:
  schedule:
    # MEASURED 2026-08-08: GitHub honoured this */5 cron every 50-180 min, not
    # every 5 — scheduled workflows are heavily deprioritised and no cron value
    # fixes that. So the cron is only a re-starter: each run stays resident for
    # ~5.5h polling every 90s (see LOOP_* below), which is what actually
    # delivers the freshness. Public repo => unlimited minutes, so this is free.
    - cron: '*/5 * * * *'
  workflow_dispatch:

# least privilege: the job only reads the repo; secrets are injected explicitly
permissions:
  contents: read

# A late run must never pile up behind a slow one.
concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # A resident poller, not a one-shot job: 5h50m < GitHub's 6h ceiling.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r pipeline/requirements.txt
      - run: python pipeline/run.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # optional: set this secret to enable the OpenRouter failover
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Stay resident ~5.5h polling every 90s, then exit; the queued run
          # (concurrency group, cancel-in-progress: false) takes over, so
          # coverage is continuous regardless of when the cron is honoured.
          LOOP_SECONDS: '90'
          LOOP_MAX_SECONDS: '19800'
