name: pipeline
on:
  schedule:
    # Public repo => unlimited free Actions minutes, so cadence is set by news
    # latency, not by budget. GitHub's cron floor is 5 min and scheduled runs
    # can lag a few minutes under load; the in-run loop below covers that gap.
    - cron: '*/5 * * * *'
  workflow_dispatch:

# least privilege: the job only reads the repo; secrets are injected explicitly
permissions:
  contents: read

# A late run must never pile up behind a slow one.
concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r pipeline/requirements.txt
      - run: python pipeline/run.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Poll for ~4 min inside the run, then exit before the next cron.
          # Turns a 5-min cron into ~90-second freshness.
          LOOP_SECONDS: '90'
          LOOP_MAX_SECONDS: '240'
